<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>APIs</title>
</head>
<body>
    <main class="container text-center d-flex flex-column justify-content-center">

        <section id="pokemon">
            <h1 class="text-success text-center">APIs</h1>
            <div class="row justify-content-center" id="listarpokemon">

                <div class="row">
                    <div class="col-12">
                        <h1 class="font-weight-bold text-success">API-Pokemon</h1>
                    </div>
                </div>

                <article class="col-12 col-sm-12 col-md-6 col-lg-4 mb-2">
                    <div>
                        <button type="submit" class="btn btn-danger mb-3" onclick="btnSeleccionar()">Pokédex</button>
                    </div>
                    <div class="border border-gray border-1 rounded-3 text-center overflow-hidden" id="pok-1">
                        <div class="p-3">
                            <img class="img-fluid mb-2" alt="Pokemon">
                            <h4 class="text-success text-center">habilidades</h4>
                            <ol class="list-unstyled text-center mb-0"></ol>
                        </div>
                        <a href="#" class="d-block bg-secondary text-white py-2 text-decoration-none">
                            <p class="lead mb-0 text-center"></p>
                        </a>
                    </div>
                </article>
            </div>
        </section>

        <section id="usuarios">
            <h1 class="font-weight-bold text-success">API-Users</h1>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                    </tr>
                </thead>
                <tbody id="data">
                </tbody>
            </table>
        </section>

        <section id="memes">
            <h1 class="font-weight-bold text-success text-center">API-Memes</h1>
            <div class="row border" id="list-memes">
                <div class="col-12 col-sm-6 col-md-3 mb-3 d-flex justify-content-center" id="meme">
                    <div class="border rounded-3 shadow-sm" style="width: 300px; height: 300px;">
                        <img class="w-100 h-100 object-fit-cover rounded" alt="Meme">
                    </div>
                </div>
            </div>
        </section>

        <section id="gifs">
            <h1 class="font-weight-bold text-success text-center">API-Gifs</h1>
            <div class="card shadow-sm">
                <div class="card-body chat-body" id="chat-gif" aria-live="polite"></div>

                <div class="card-footer bg-white">
                    <div class="input-group">
                        <label for="mensaje-gif" class="visually-hidden">Mensaje</label>
                        <input
                            type="text"
                            id="mensaje-gif"
                            class="form-control"
                            placeholder="Escribe qué GIF buscar...">

                        <button type="button" class="btn btn-success" onclick="enviarGif()">
                            Buscar GIF
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="ia">
            <h1 class="font-weight-bold text-success text-center">API-IA</h1>
            <div class="card shadow-sm">
                <div class="card-body chat-body" id="chat" aria-live="polite"></div>

                <div class="card-footer bg-white">
                    <div class="input-group">
                        <label for="mensaje" class="visually-hidden">Mensaje</label>
                        <input
                            type="text"
                            id="mensaje"
                            class="form-control"
                            placeholder="Escribe tu mensaje...">

                        <button type="button" class="btn btn-success" onclick="sendIA()">
                            Enviar
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p class="text-secondary">Todos los derechos reservados</p>
    </footer>

    <script src="datosPokemon.js"></script>
    <script src="datosUsers.js"></script>
    <script src="datosMemes.js"></script>
    <script src="datosGiphy.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="datosChat.js"></script>
</body>
</html>
